{% extends "base.html" %}

{% block title %}Đăng Ký Tài Khoản Sinh Viên{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-md-7 col-lg-6">
        <div class="vh-card p-4 p-md-5 shadow-lg border-0 rounded-4">
            <div class="text-center mb-4">
                <div class="bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 70px; height: 70px;">
                    <i class="bi bi-person-plus-fill fs-1"></i>
                </div>
                <h3 class="fw-bold text-primary mb-1">ĐĂNG KÝ TÀI KHOẢN SINH VIÊN</h3>
                <p class="text-muted small">Trường Cao Đẳng Cà Mau</p>
            </div>

            <form method="POST" action="{{ url_for('register') }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label fw-semibold">Tên đăng nhập <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="VD: sv_nguyenvana" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu..." required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="full_name" class="form-label fw-semibold">Họ và tên Sinh viên <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="full_name" name="full_name" placeholder="VD: Nguyễn Văn An" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="student_code" class="form-label fw-semibold">Mã số Sinh viên (MSSV)</label>
                        <input type="text" class="form-control" id="student_code" name="student_code" placeholder="VD: SV2024003">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="class_name" class="form-label fw-semibold">Lớp học</label>
                        <input type="text" class="form-control" id="class_name" name="class_name" placeholder="VD: CĐ CNTT K16">
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100 mb-3 shadow-sm font-weight-bold">
                    <i class="bi bi-check-circle-fill me-2"></i> HOÀN TẤT ĐĂNG KÝ
                </button>
            </form>

            <div class="text-center pt-3 border-top">
                <p class="text-muted mb-0">Đã có tài khoản? <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Đăng nhập ngay</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
