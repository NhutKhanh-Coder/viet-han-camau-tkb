{% extends "base.html" %}

{% block title %}Đăng Nhập{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="vh-card p-4 p-md-5 shadow-lg border-0 rounded-4">
            <div class="text-center mb-4">
                <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3 shadow" style="width: 70px; height: 70px;">
                    <i class="bi bi-mortarboard-fill fs-1 text-warning"></i>
                </div>
                <h3 class="fw-bold text-primary mb-1">ĐĂNG NHẬP HỆ THỐNG</h3>
                <p class="text-muted small">Phần mềm Ôn tập Trắc nghiệm Tự động - Trường Cao Đẳng Cà Mau</p>
            </div>

            <!-- DEMO QUICK LOGIN BUTTONS -->
            <div class="alert alert-info border-0 bg-info-subtle mb-4">
                <div class="fw-bold text-dark mb-2 text-center" style="font-size: 0.85rem;">
                    <i class="bi bi-lightning-charge-fill text-warning"></i> ĐĂNG NHẬP NHANH DEMO (1-CLICK):
                </div>
                <div class="d-flex gap-2">
                    <button type="button" onclick="quickLogin('sinhvien', '123456')" class="btn btn-primary btn-sm flex-fill fw-bold shadow-sm">
                        <i class="bi bi-person-fill me-1"></i> Sinh viên Demo
                    </button>
                    <button type="button" onclick="quickLogin('giaovien', '123456')" class="btn btn-dark btn-sm flex-fill fw-bold shadow-sm">
                        <i class="bi bi-person-badge-fill me-1"></i> Giáo viên Demo
                    </button>
                </div>
            </div>

            <form method="POST" action="{{ url_for('login') }}" id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Tên đăng nhập / Mã SV</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person-fill"></i></span>
                        <input type="text" class="form-control form-control-lg fs-6" id="username" name="username" placeholder="Nhập tên đăng nhập..." required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                        <input type="password" class="form-control form-control-lg fs-6" id="password" name="password" placeholder="Nhập mật khẩu..." required>
                    </div>
                </div>

                <button type="submit" class="btn btn-vh-primary btn-lg w-100 mb-3 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-2"></i> ĐĂNG NHẬP
                </button>
            </form>

            <div class="text-center pt-3 border-top">
                <p class="text-muted mb-0">Chưa có tài khoản sinh viên? <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Đăng ký ngay</a></p>
            </div>
        </div>
    </div>
</div>

<script>
function quickLogin(user, pass) {
    document.getElementById('username').value = user;
    document.getElementById('password').value = pass;
    document.getElementById('loginForm').submit();
}
</script>
{% endblock %}
